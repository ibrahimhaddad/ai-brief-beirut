# The AI Brief - LB Edition
# Site settings. GitHub Pages rebuilds the site whenever a file changes.

title: "The AI Brief - LB Edition"
short_title: "The AI Brief"
edition: "LB Edition"
tagline: "What this week's AI developments mean for university staff, faculty, students and founders in Lebanon and the region."
description: "A weekly briefing by Ibrahim Haddad on what AI developments mean for university staff, faculty, students and founders in Lebanon and the region."
author: "Ibrahim Haddad"

# Pilot address. At launch with a custom domain: set url to the domain, set baseurl to "", add a CNAME file.
url: "https://ibrahimhaddad.github.io"
baseurl: "/ai-brief-beirut"

# While pilot is true, every page carries a noindex tag and a Pilot tag. Set to false at launch.
pilot: true

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

collections:
  issues:
    output: true

defaults:
  - scope:
      path: ""
      type: issues
    values:
      layout: issue

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Feedback form. Web3Forms emails each submission to the address this access key was
# created for. The key is public by design: it routes submissions but cannot sign in.
web3forms_key: "1273e6ec-e4f9-4a1a-8155-3fc5792155e2"
