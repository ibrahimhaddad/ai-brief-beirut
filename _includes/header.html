<header class="site-header">
  <div class="wrap header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, home">
      <span class="wordmark-title">{{ site.short_title }}</span>
      <span class="wordmark-edition">{{ site.edition }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/archive/' | relative_url }}"{% if page.url == "/archive/" %} aria-current="page"{% endif %}>Archive</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/feedback/' | relative_url }}"{% if page.url == "/feedback/" %} aria-current="page"{% endif %}>Feedback</a>
    </nav>
  </div>
</header>
