{% comment %} Figure: SVG on the page, tap or click to open the full-size PNG. Pass file (name without extension), alt and caption (the takeaway, not a repeat of the title or source). {% endcomment %}
<figure class="fig"><a class="fig-link" href="{{ '/assets/figures/' | append: include.file | append: '.png' | relative_url }}"><img src="{{ '/assets/figures/' | append: include.file | append: '.svg' | relative_url }}" alt="{{ include.alt }}" width="1200" height="675" loading="lazy"><span class="visually-hidden"> (open full size)</span></a><figcaption>{{ include.caption }} <span class="fig-hint">Tap to enlarge.</span></figcaption></figure>
